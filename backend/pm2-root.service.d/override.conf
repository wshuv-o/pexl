# Belt-and-braces: a cgroup-level memory cap on the PM2 root daemon.
#
# This is the LAST line of defence. PM2's max_memory_restart in
# ecosystem.config.js is the primary guard — if for any reason it fails to
# fire (PM2 itself is unresponsive, the worker grows faster than PM2 can
# react), this cgroup limit ensures the kernel will only kill processes
# *inside* pm2-root.service, never global system processes.
#
# Installation
# ------------
#   sudo mkdir -p /etc/systemd/system/pm2-root.service.d
#   sudo cp pm2-root.service.d/override.conf /etc/systemd/system/pm2-root.service.d/
#   sudo systemctl daemon-reload
#   sudo systemctl restart pm2-root
#
# Verify
# ------
#   systemctl show pm2-root | grep -E '^(MemoryMax|MemorySwapMax|MemoryHigh)='
#   systemd-cgtop --order=memory      # watch pm2-root.service in real time
#
# Tuning
# ------
# These numbers must be HIGHER than PM2's max_memory_restart so PM2 always
# fires first (clean restart) before the cgroup fires (hard kill).
#
# Sizing for the current 15 GB box, with PM2 set to restart at 4.5 GB:
#   * MemoryMax=8G  — pm2-root.service can use up to 8 GB total
#   * MemoryHigh=7G — kernel starts reclaiming pagecache aggressively here
#   * Remaining ~7 GB for MySQL, Logflare, all Node apps, OS
#
# If you have other PM2 apps besides pexl_api, account for their RAM too.
# This cap covers the WHOLE pm2-root.service, not just pexl_api.

[Service]
# Hard cap: kernel OOM-kills processes IN THIS UNIT once exceeded.
# Anything outside pm2-root.service is untouched.
MemoryMax=8G

# Swap cap: 0 prevents the cgroup from using swap, which is what was
# turning brief allocation spikes into multi-minute thrash-and-die cycles.
MemorySwapMax=0

# Soft pressure point: the kernel starts reclaiming cache aggressively
# at this level, before MemoryMax is hit.
MemoryHigh=7G

# Keep PM2 itself OOM-friendly so the SUPERVISOR survives even if a worker
# dies. -500 = "much less likely to be picked by OOM killer than children".
OOMScoreAdjust=-500
