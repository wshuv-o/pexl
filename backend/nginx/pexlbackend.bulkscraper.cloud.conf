# nginx server block for the pexl_api backend.
#
# Deploy with:
#     sudo bash backend/nginx/apply.sh
#
# This is a full replacement for
#     /etc/nginx/sites-available/pexlbackend.bulkscraper.cloud
# Keep this file in sync when you change SSL, add subdomains, or tune
# timeouts — nginx-on-prod should be a mirror of what's here.

server {
    server_name pexlbackend.bulkscraper.cloud;

    # PDF uploads can hit ~200MB for scanned batches. 250MB gives a
    # small safety margin over `PEXL_DISK_THRESHOLD_MB` × a few pages.
    client_max_body_size 250M;

    location / {
        proxy_pass http://127.0.0.1:8006;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host       $host;

        proxy_cache_bypass $http_upgrade;

        # ── The real fix ───────────────────────────────────────────
        # OCR on a 30+ page PDF can take 60-300s+ on CPU-only Tesseract.
        # nginx's default proxy_read_timeout is 60s — it kills the
        # connection while the backend is still building the OCR'd PDF.
        # Browser then sees a 504 with no CORS headers and reports it
        # as a CORS error, which is deeply misleading.
        #
        # 15 minutes covers even the worst force-ocr rebuild on the
        # 15GB Hostinger box. Bump higher if you start batching PDFs
        # over 100 pages regularly.
        proxy_read_timeout    900s;
        proxy_send_timeout    900s;
        proxy_connect_timeout 900s;
        send_timeout          900s;
        client_body_timeout   900s;

        # Don't buffer the OCR'd PDF response — it can be tens of MB
        # and there's no reason to sit in nginx heap before forwarding
        # each chunk to the client. Also helps with streaming responses.
        proxy_buffering       off;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate     /etc/letsencrypt/live/pexlbackend.bulkscraper.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pexlbackend.bulkscraper.cloud/privkey.pem;   # managed by Certbot
    include             /etc/letsencrypt/options-ssl-nginx.conf;                          # managed by Certbot
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;                                # managed by Certbot
}

server {
    if ($host = pexlbackend.bulkscraper.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    server_name pexlbackend.bulkscraper.cloud;
    listen 80;
    return 404; # managed by Certbot
}
